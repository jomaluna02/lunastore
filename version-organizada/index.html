<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Luna XXI Store — accesorios que hablan por ti.">
<title>LUNA XXI STORE | Accesorios con actitud</title>
<style>
/* =========================================================
   ESTILOS GENERALES
========================================================= */
:root {
    --ink: #08090b;
    --surface: #101216;
    --surface-2: #17191f;
    --surface-3: #20232a;
    --silver: #d9dce2;
    --muted: #8e949f;
    --line: rgba(217,220,226,.14);
    --white: #f8f9fb;
    --accent: #aeb5c2;
    --accent-strong: #f1f3f6;
    --shadow: 0 24px 70px rgba(0,0,0,.35);
    --radius: 22px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--ink);
    color: var(--white);
    font-family: 'DM Sans', Arial, sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
}

.container {
    width: min(1180px, calc(100% - 40px));
    margin: auto;
}

/* =========================================================
   BARRA SUPERIOR Y ENCABEZADO
========================================================= */
.announcement {
    background: var(--silver);
    color: var(--ink);
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-align: center;
    padding: 9px 16px;
    text-transform: uppercase;
}

.site-header {
    position: sticky;
    top: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 15px max(20px, calc((100% - 1180px)/2));
    background: rgba(8,9,11,.8);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(18px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--white);
    text-decoration: none;
    min-width: 190px;
}

.brand img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border: 1px solid var(--line);
    border-radius: 14px;
}

.brand-copy {
    display: flex;
    flex-direction: column;
    line-height: 1;
}

.brand-copy strong {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.02rem;
    letter-spacing: .18em;
}

.brand-copy span {
    font-size: .57rem;
    letter-spacing: .32em;
    color: var(--muted);
    margin-top: 6px;
}

.main-nav {
    display: flex;
    gap: 28px;
}

.main-nav a {
    color: var(--muted);
    font-size: .82rem;
    font-weight: 600;
    text-decoration: none;
    transition: .25s;
}

.main-nav a:hover {
    color: var(--white);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon-btn,
.cart-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--white);
    border-radius: 12px;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .25s;
}

.icon-btn:hover,
.cart-btn:hover {
    border-color: var(--silver);
    transform: translateY(-2px);
}

.cart-btn {
    position: relative;
    width: auto;
    padding: 0 13px;
    font-size: .85rem;
}

.cart-count {
    position: absolute;
    top: -7px;
    right: -7px;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border-radius: 20px;
    background: var(--silver);
    color: var(--ink);
    font-size: .68rem;
    font-weight: 800;
    display: grid;
    place-items: center;
}

/* =========================================================
   INICIO / HERO
========================================================= */
.hero {
    min-height: 650px;
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
    background: radial-gradient(circle at 78% 45%, rgba(174,181,194,.17), transparent 25%), radial-gradient(circle at 16% 10%, rgba(255,255,255,.07), transparent 24%), var(--ink);
}

.hero:after {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    right: -180px;
    top: 30px;
    border: 1px solid rgba(217,220,226,.13);
    border-radius: 50%;
    box-shadow: 0 0 0 55px rgba(217,220,226,.025), 0 0 0 110px rgba(217,220,226,.018);
    animation: orbit 18s linear infinite;
}

.hero-content {
    position: relative;
    z-index: 2;
    width: min(1180px, calc(100% - 40px));
    margin: auto;
    padding: 86px 0;
}

.eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--silver);
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
}

.eyebrow i {
    display: block;
    width: 28px;
    height: 1px;
    background: var(--silver);
}

h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(3.6rem, 9vw, 8.3rem);
    line-height: .88;
    letter-spacing: -.08em;
    max-width: 790px;
    margin: 25px 0 30px;
}

h1 em {
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 1px var(--silver);
}

.hero-copy {
    max-width: 480px;
    color: var(--muted);
    font-size: 1.03rem;
}

.hero-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 34px;
}

.primary-btn,
.ghost-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    border-radius: 13px;
    text-decoration: none;
    font-size: .82rem;
    font-weight: 700;
    cursor: pointer;
    transition: .25s;
}

.primary-btn {
    background: var(--silver);
    color: var(--ink);
    border: 1px solid var(--silver);
}

.ghost-btn {
    color: var(--white);
    border: 1px solid var(--line);
    background: transparent;
}

.hero-note {
    display: flex;
    gap: 24px;
    margin-top: 46px;
    color: var(--muted);
    font-size: .72rem;
}

.hero-note strong {
    display: block;
    color: var(--white);
    font-size: 1.35rem;
    font-family: 'Space Grotesk', sans-serif;
}

.hero-product {
    position: absolute;
    z-index: 2;
    right: max(7%, calc((100% - 1180px)/2));
    bottom: 55px;
    width: clamp(190px, 22vw, 290px);
    height: clamp(250px, 31vw, 380px);
    border: 1px solid rgba(217,220,226,.25);
    border-radius: 180px 180px 24px 24px;
    padding: 17px;
    transform: rotate(5deg);
    background: linear-gradient(145deg, rgba(217,220,226,.14), rgba(255,255,255,.02));
    box-shadow: var(--shadow);
    animation: float 6s ease-in-out infinite;
}

.hero-product img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 25px;
    border-radius: 160px 160px 15px 15px;
    filter: saturate(.88) contrast(1.04);
}

.hero-product-label {
    position: absolute;
    bottom: 28px;
    left: 28px;
    padding: 8px 11px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 9px;
    background: rgba(8,9,11,.7);
    font-size: .68rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
}

/* =========================================================
   MARQUEE
========================================================= */
.marquee {
    overflow: hidden;
    border-bottom: 1px solid var(--line);
    border-top: 1px solid var(--line);
    background: var(--surface);
}

.marquee-track {
    display: flex;
    width: max-content;
    animation: marquee 25s linear infinite;
}

.marquee-track span {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 15px 28px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: .72rem;
    letter-spacing: .2em;
    color: var(--silver);
    white-space: nowrap;
}

.marquee-track span:after {
    content: '✦';
    color: var(--muted);
}

/* =========================================================
   SECCIONES Y CATÁLOGO
========================================================= */
.section {
    padding: 105px 0;
}

.section-kicker {
    color: var(--muted);
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
}

.section-heading {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 25px;
    margin: 13px 0 33px;
}

.section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2rem, 4vw, 3.8rem);
    letter-spacing: -.06em;
    line-height: 1;
}

.section-subtitle {
    max-width: 335px;
    color: var(--muted);
    font-size: .9rem;
}

.filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 24px;
}

.filters {
    display: flex;
    gap: 8px;
    overflow: auto;
    padding-bottom: 3px;
}

.filter-chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 10px 15px;
    font-size: .74rem;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

.filter-chip:hover,
.filter-chip.active {
    background: var(--silver);
    border-color: var(--silver);
    color: var(--ink);
}

.catalog-tools {
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-box {
    position: relative;
}

.search-box input {
    width: 180px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--white);
    padding: 10px 15px 10px 36px;
    outline: none;
    font: inherit;
    font-size: .75rem;
}

.search-box span {
    position: absolute;
    left: 14px;
    top: 8px;
    color: var(--muted);
}

select {
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    padding: 10px 12px;
    outline: none;
    font: inherit;
    font-size: .74rem;
}

.results-line {
    color: var(--muted);
    font-size: .72rem;
    margin: -10px 0 20px;
}

/* =========================================================
   PRODUCTOS
   Cada producto está separado visualmente para facilitar
   futuras modificaciones.
========================================================= */
.product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.product-card {
    position: relative;
    background: linear-gradient(145deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    transition: .35s;
    animation: rise .55s both;
}

.product-media {
    height: 340px;
    position: relative;
    overflow: hidden;
    background: #090a0c;
}

.product-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .65s cubic-bezier(.2,.7,.2,1);
    filter: saturate(.86);
}

.product-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    padding: 7px 10px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px;
    background: rgba(8,9,11,.72);
    font-size: .63rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
}

.quick-btn {
    position: absolute;
    right: 14px;
    bottom: 14px;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,.24);
    border-radius: 12px;
    background: rgba(8,9,11,.78);
    color: var(--white);
    font-size: 1.2rem;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    transition: .25s;
}

.product-info {
    padding: 19px;
}

.product-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .08em;
}

.product-name {
    min-height: 54px;
    margin: 9px 0 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.08rem;
    line-height: 1.12;
}

.product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
}

.price {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.2rem;
}

.add-btn {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--silver);
    color: var(--ink);
    padding: 9px 12px;
    font-size: .72rem;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

.empty-state {
    grid-column: 1/-1;
    text-align: center;
    border: 1px dashed var(--line);
    padding: 70px 20px;
    border-radius: var(--radius);
    color: var(--muted);
}

.empty-state strong {
    display: block;
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    margin-bottom: 8px;
}

/* =========================================================
   CATEGORÍAS
========================================================= */
.category-strip {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    gap: 16px;
}

.category-card {
    min-height: 225px;
    position: relative;
    display: flex;
    align-items: end;
    padding: 24px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
    background: linear-gradient(135deg, #20232a, #0e1014);
    cursor: pointer;
    transition: .3s;
}

.category-card:before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 80% 10%, rgba(255,255,255,.18), transparent 28%);
    transition: .3s;
}

.category-card:first-child {
    background: linear-gradient(135deg, #30343c, #0b0c0f);
}

.category-card.has-image {
    background-size: cover;
    background-position: center;
}

.category-card.has-image:after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,9,11,.05), rgba(8,9,11,.9));
}

.category-card.is-coming {
    background: linear-gradient(135deg, #252930, #0b0c0f);
}

.category-card h3,
.category-card p {
    position: relative;
    z-index: 1;
}

.category-card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.7rem;
    letter-spacing: -.05em;
}

.category-card p {
    color: var(--muted);
    font-size: .76rem;
    margin-top: 5px;
}

.category-card .arrow {
    position: absolute;
    top: 22px;
    right: 23px;
    font-size: 1.3rem;
    color: var(--silver);
}

/* =========================================================
   EXPERIENCIA
========================================================= */
.experience {
    padding: 40px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(120deg, var(--surface-2), var(--surface));
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 35px;
    align-items: center;
}

.experience h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2rem,4vw,3.4rem);
    line-height: .98;
    letter-spacing: -.07em;
}

.experience h2 span {
    color: var(--muted);
}

.experience p {
    color: var(--muted);
    font-size: .9rem;
    margin-top: 15px;
    max-width: 460px;
}

.experience-points {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
}

.experience-point {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: rgba(255,255,255,.025);
}

.experience-point b {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
}

/* =========================================================
   ANIMACIONES Y RESPONSIVE
========================================================= */
@keyframes float {
    0%, 100% { transform: rotate(5deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-10px); }
}

@keyframes orbit {
    to { transform: rotate(360deg); }
}

@keyframes marquee {
    to { transform: translateX(-50%); }
}

@keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
    .main-nav { display: none; }
    .product-grid { grid-template-columns: repeat(2, 1fr); }
    .category-strip { grid-template-columns: 1fr; }
    .experience { grid-template-columns: 1fr; }
}

@media (max-width: 620px) {
    .product-grid { grid-template-columns: 1fr; }
    .hero-product { opacity: .45; right: 4%; }
    .section-heading { display: block; }
    .section-subtitle { margin-top: 12px; }
    .filter-row { display: block; }
    .catalog-tools { margin-top: 12px; }
}
</style>
</head>

<body>
