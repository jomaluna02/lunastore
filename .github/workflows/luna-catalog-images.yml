name: Ajuste de imágenes del catálogo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/luna-catalog-images.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ajustar imágenes de todas las tarjetas
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_media = ".product-media{height:340px;position:relative;overflow:hidden;background:#090a0c}"
          new_media = ".product-media{height:340px;position:relative;overflow:hidden;background:#fff}"

          old_img = ".product-media img{width:100%;height:100%;object-fit:cover;transition:transform .65s cubic-bezier(.2,.7,.2,1);filter:saturate(.86)}"
          new_img = ".product-media img{width:100%;height:100%;object-fit:contain;object-position:center;padding:18px 28px;box-sizing:border-box;transition:transform .65s cubic-bezier(.2,.7,.2,1);filter:saturate(.86)}"

          old_hover = ".product-card:hover .product-media img{transform:scale(1.08)}"
          new_hover = ".product-card:hover .product-media img{transform:scale(1.025)}"

          for old, new in ((old_media, new_media), (old_img, new_img), (old_hover, new_hover)):
              if old not in html:
                  raise SystemExit(f'No se encontró el bloque esperado: {old}')
              html = html.replace(old, new, 1)

          old_later = ".product-card:hover .product-media img{\n  transform:scale(1.055);\n  filter:saturate(.94) contrast(1.05);\n}"
          new_later = ".product-card:hover .product-media img{\n  transform:scale(1.025);\n  filter:saturate(.94) contrast(1.05);\n}"
          if old_later not in html:
              raise SystemExit('No se encontró el hover premium esperado.')
          html = html.replace(old_later, new_later, 1)

          marker = "/* LUNA XXI — imágenes de catálogo normalizadas */"
          if marker not in html:
              html = html.replace('</style>', f"\n{marker}\n/* Todas las tarjetas usan una escala visual uniforme para que los nuevos productos no requieran ajustes individuales. */\n</style>", 1)

          path.write_text(html, encoding='utf-8')

      - name: Guardar cambios y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/luna-catalog-images.yml
          git commit -m "Normalizar tamaño visual de imágenes del catálogo" || exit 0
          git rm .github/workflows/luna-catalog-images.yml
          git commit -m "Limpiar workflow temporal de ajuste visual"
          git push
