name: Sincronizar catálogo

on:
  push:
    branches:
      - main
    paths:
      - data/products.json
      - scripts/sync-products.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Sincronizar productos con index.html
        run: python scripts/sync-products.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Corrige sincronización del catálogo"
            git push
          fi
