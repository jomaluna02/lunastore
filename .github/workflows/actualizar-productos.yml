name: Actualizar productos Luna XXI

on:
  push:
    branches: [main]

jobs:
  update-products:
    if: ${{ !contains(github.event.head_commit.message, 'Corregir bloque de productos nuevos') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corregir productos
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'id:207' in text:
              text = text.replace("\n\\\n{\nid:207", "\n{\nid:207", 1)
              path.write_text(text, encoding='utf-8')
          else:
              new_products = r'''\
          {
          id:207,
          category:'relojes',
          label:'Nuevo',
          name:'Rolex Land-Dweller — Plata / Dorado',
          price:109000,
          priceLabel:'$109.000',
          status:'disponible',
          images:['relojes/Rolex%20Land-Dweller%20Plata-Dorado%201.png','relojes/Rolex%20Land-Dweller%20Plata-Dorado%202.png','relojes/Rolex%20Land-Dweller%20Plata-Dorado%203.png'],
          specs:['Diseño inspirado en la línea Land-Dweller','Caja de referencia de 40 mm','Bisel estriado','Indicador de fecha con lente tipo Cyclops','Brazalete de estilo Flat Jubilee']
          },
          {
          id:208,
          category:'relojes',
          label:'Nuevo',
          name:'Rolex President Day-Date — Dorado / Plata',
          price:119000,
          priceLabel:'$119.000',
          status:'disponible',
          images:['relojes/Rolex%20President%20Day%20Date%20Dorado-Plata%201.png','relojes/Rolex%20President%20Day%20Date%20Dorado-Plata%202.png','relojes/Rolex%20President%20Day%20Date%20Dorado%20Plata%203.png'],
          specs:['Diseño clásico Day-Date','Brazalete de estilo President','Bisel estriado','Visualización de día y fecha','Cristal de referencia tipo zafiro con lente Cyclops']
          },
          {
          id:209,
          category:'relojes',
          label:'Nuevo',
          name:'Rolex President Day-Date — Negro',
          price:119000,
          priceLabel:'$119.000',
          status:'disponible',
          images:['relojes/Rolex%20President%20Day%20Date%20Negro%201.png','relojes/Rolex%20President%20Day%20Date%20Negro%202.png','relojes/Rolex%20President%20Day%20Date%20Negro%203.png'],
          specs:['Esfera negra de estilo clásico','Diseño Day-Date','Brazalete de estilo President','Bisel estriado','Visualización de día y fecha']
          },
          {
          id:210,
          category:'relojes',
          label:'Nuevo',
          name:'Rolex Submariner — Verde / Plata / Dorado',
          price:1090000,
          priceLabel:'$1.090.000',
          status:'disponible',
          images:['relojes/Rolex%20Submariner%20Verde-Plata-Dorado%201.png','relojes/Rolex%20Submariner%20Verde-Plata-Dorado%202.png','relojes/Rolex%20Submariner%20Verde-Plata-Dorado%203.png'],
          specs:['Diseño inspirado en la línea Submariner','Caja de referencia de 41 mm','Bisel giratorio unidireccional','Bisel verde de estilo Cerachrom','Diseño de alta legibilidad para el uso diario']
          },
          {
          id:211,
          category:'relojes',
          label:'Nuevo',
          name:'Technomarine Black Reef — Negro / Dorado',
          price:99000,
          priceLabel:'$99.000',
          status:'disponible',
          images:['relojes/Technomarine%20Black%20Reef%20Negro-Dorado%201.png','relojes/Technomarine%20Black%20Reef%20Negro-Dorado%202.png','relojes/Technomarine%20Black%20Reef%20Negro-Dorado%203.png'],
          specs:['Diseño Black Reef','Combinación de acabados negro y dorado','Estética deportiva y robusta','Diseño pensado para uso diario','Esfera de alta presencia visual']
          },
          {
          id:212,
          category:'relojes',
          label:'Nuevo',
          name:'Patek Philippe — Dorado / Plata',
          price:69000,
          priceLabel:'$69.000',
          status:'disponible',
          images:['relojes/Patek%20Phillipe%20Dorado-Plata%201.png','relojes/Patek%20Phillipe%20Dorado-Plata%202.png','relojes/Patek%20Phillipe%20Dorado-Plata%203.png'],
          specs:['Diseño clásico en tonos dorado y plata','Acabado metálico de estilo elegante','Esfera de diseño clásico','Brazalete metálico','Versátil para ocasiones casuales y formales']
          }'''
              pattern = r"(const products=\[.*?)(\n\];)"
              match = re.search(pattern, text, re.S)
              if not match:
                  raise SystemExit('No se encontró el bloque de productos')
              updated = match.group(1) + ',\n' + new_products + match.group(2)
              text = text[:match.start(1)] + updated + text[match.end(2):]
              path.write_text(text, encoding='utf-8')

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir productos nuevos" || exit 0
          git push