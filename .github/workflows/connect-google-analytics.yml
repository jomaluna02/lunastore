name: Connect Google Analytics

on:
  push:
    paths:
      - '.github/workflows/connect-google-analytics.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Google Analytics tag
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'G-NTPMEHMZJW' not in text:
              tag = '''<!-- Google Analytics 4 -->\n<script async src="https://www.googletagmanager.com/gtag/js?id=G-NTPMEHMZJW"></script>\n<script>\nwindow.dataLayer = window.dataLayer || [];\nfunction gtag(){dataLayer.push(arguments);}\ngtag('js', new Date());\ngtag('config', 'G-NTPMEHMZJW');\n</script>\n<!-- End Google Analytics 4 -->\n'''
              text = text.replace('<head>', '<head>\n' + tag, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit Analytics connection and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/connect-google-analytics.yml
          git add index.html .github/workflows/connect-google-analytics.yml
          git diff --cached --quiet && exit 0
          git commit -m "Connect Google Analytics"
          git push
