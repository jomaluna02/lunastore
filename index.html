<style>
.reveal-on-scroll{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s ease;will-change:opacity,transform}
.reveal-on-scroll.is-visible{opacity:1;transform:none}
.primary-btn,.ghost-btn,.buy-btn,.whatsapp-btn,.icon-btn,.filter-chip{will-change:transform}
.primary-btn:active,.ghost-btn:active,.buy-btn:active,.whatsapp-btn:active,.icon-btn:active,.filter-chip:active{transform:translateY(0) scale(.98)}
.product-card{will-change:transform,box-shadow}
.product-card .product-info{transition:transform .35s ease}
.product-card:hover .product-info{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal-on-scroll,.reveal-on-scroll.is-visible,.product-card,.hero-product,.hero:after,.marquee-track{animation:none!important;transition:none!important;transform:none!important;opacity:1!important}}
@media (hover:none){.photo-hint{opacity:1;transform:none}.product-card:hover{transform:none;box-shadow:none}}

/* Existing visual styles below remain part of the page. */
</style>

<!-- EXISTING SITE CONTENT -->

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const selectors=['.trust-section','.section','#coleccion','#nosotros','.instagram-section','.hero-copy','.hero-actions','.hero-note'];
  selectors.forEach(selector=>document.querySelectorAll(selector).forEach(el=>el.classList.add('reveal-on-scroll')));
  if('IntersectionObserver' in window){
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target);}
      });
    },{threshold:.12,rootMargin:'0px 0px -30px'});
    document.querySelectorAll('.reveal-on-scroll').forEach(el=>observer.observe(el));
  }else{
    document.querySelectorAll('.reveal-on-scroll').forEach(el=>el.classList.add('is-visible'));
  }
});
</script>
